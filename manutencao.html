<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="navbar.css">

<title>Dashboard Manutenção</title>

<style>
body {
  margin: 0;
  font-family: "Montserrat", Arial, sans-serif;
  background: #f1f3f6;
}


.contadores {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.contador-card {
  background: white;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  font-size: var(--fonte-app);
}

.contador-top {
  font-size: 0.75em;
  color: #777;
}

.contador-numero {
  font-size: 1.375em;
  font-weight: bold;
  margin-top: 5px;
}

.contador-card.laranja { border-left: 5px solid #ff9800; }
.contador-card.amarelo { border-left: 5px solid #ffc107; }

.lista {
  padding: 10px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  font-size: var(--fonte-app);
}

.card:active {
  transform: scale(0.97);
}

.card-top {
  display: flex;
  justify-content: space-between;
}

.placa {
  font-size: 1.125em;
  font-weight: bold;
}

.status {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 0.75em;
  color: white;
}

.status.laranja { background: #ff9800; }
.status.amarelo { background: #ffc107; color: black; }

.info {
  margin-top: 5px;
  color: #555;
  font-size: 0.8125em;
}

/* FILTROS */
.filtros {
  background: white;
  padding: 10px;
  display: grid;
  gap: 8px;
}

input, select {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  border: none;
  border-radius: 8px;
  padding: 11px 12px;
  background: #1f2937;
  color: white;
  font-weight: 800;
  cursor: pointer;
}

.importacao-asn {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
}

.import-status {
  grid-column: 1 / -1;
  color: #555;
  font-size: 0.8125em;
}

@media (max-width: 520px) {
  .importacao-asn {
    grid-template-columns: 1fr;
  }
}

</style>
</head>

<body>

<div class="topbar">
  <span class="titulo-topbar">🔧 Manutenção</span>
  <!-- Logo central -->
  <img src="suzano-logo.png" class="logo-topbar">
</div>

<div class="filtros">
  <input id="busca" placeholder="Buscar por placa">

  <select id="filtroTipo">
    <option value="">Todos os tipos</option>
    <option value="carreta">Carreta</option>
    <option value="prancha">Prancha</option>
    <option value="comboio">Comboio</option>
    <option value="cavalo">Cavalo</option>
  </select>
</div>


<div class="contadores" id="contadores"></div>

<div class="lista" id="lista"></div>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#1f2937">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="/icone-192.png">

<script src="xlsx.full.min.js"></script>

<script type="module">
import { db } from "./firebase.js";
import {
  collection,
  doc,
  onSnapshot,
  query,
  serverTimestamp,
  writeBatch,
  where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { carregarNavbar } from "./navbar.js";

carregarNavbar();

if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register("/sw.js")
    .then(() => console.log("PWA ativo"))
    .catch(err => console.log(err));

}

// 1. DECLARAÇÕES GLOBAIS (Sempre no topo)
let dados = [];
let frotasCadastradas = [];

fetch("./frotas.json")
  .then(res => res.json())
  .then(data => { frotasCadastradas = Array.isArray(data) ? data : []; })
  .catch(() => { frotasCadastradas = []; });

// 2. DEFINIÇÃO DA QUERY
const q = query(
  collection(db, "implementos"),
  where("status", "in", ["aguardando_manutencao", "em_manutencao"])
);

// 3. FUNÇÕES AUXILIARES
function getStatusInfo(status) {
  switch(status) {
    case "aguardando_manutencao": return { nome: "Aguardando", cor: "laranja" };
    case "em_manutencao": return { nome: "Em manutenção", cor: "amarelo" };
    default: return { nome: "-", cor: "" };
  }
}

function prioridade(status) {
  if (status === "aguardando_manutencao") return 1;
  if (status === "em_manutencao") return 2;
  return 3;
}

function formatarData(ts) {
  if (!ts) return "-";
  try {
    const d = ts.toDate();
    return d.toLocaleString("pt-BR");
  } catch(e) { return "-"; }
}

function formatarTipoManutencao(tipo) {
  switch(tipo) {
    case "preventiva": return "Preventiva";
    case "revisao": return "Revisão";
    case "cnp": return "CNP";
    case "gm": return "GM";
    default: return tipo || "-";
  }
}

// 4. LÓGICA DE RENDERIZAÇÃO E FILTRO
function render(lista) {
  // Ordenação
  lista.sort((a, b) => {
    const p1 = prioridade(a.status);
    const p2 = prioridade(b.status);
    if (p1 !== p2) return p1 - p2;
    const d1 = a.dataInspecao?.seconds || 0;
    const d2 = b.dataInspecao?.seconds || 0;
    return d1 - d2;
  });

  const container = document.getElementById("lista");
  container.innerHTML = "";

  lista.forEach(data => {
    const status = getStatusInfo(data.status);
    const div = document.createElement("div");
    div.className = `card status-borda-${status.cor}`;
    div.innerHTML = `
      <div class="card-top">
        <div class="placa">${data.placa}</div>
        <div class="status ${status.cor}">${status.nome}</div>
      </div>
      <div class="info">
        Tipo: ${data.tipo}<br>
        Manutenção: <strong>${formatarTipoManutencao(data.tipoManutencao)}</strong><br>
        Inspeção: ${formatarData(data.dataInspecao)}
      </div>
    `;
    div.onclick = () => { window.location = "manutencao_detalhe.html?id=" + data.id; };
    container.appendChild(div);
  });

  atualizarContadores(lista);
}

function aplicarFiltros() {
  const busca = document.getElementById("busca").value.toLowerCase();
  const tipo = document.getElementById("filtroTipo").value;

  let resultado = dados;

  if (busca) {
    resultado = resultado.filter(i => i.placa.toLowerCase().includes(busca));
  }
  if (tipo) {
    resultado = resultado.filter(i => i.tipo === tipo);
  }

  render(resultado);
}

function atualizarContadores(lista) {
  const cont = { aguardando_manutencao: 0, em_manutencao: 0 };
  lista.forEach(i => { if(cont[i.status] !== undefined) cont[i.status]++; });

  document.getElementById("contadores").innerHTML = `
    <div class="contador-card laranja">
      <div class="contador-top">Aguardando manutenção</div>
      <div class="contador-numero">${cont.aguardando_manutencao}</div>
    </div>
    <div class="contador-card amarelo">
      <div class="contador-top">Em manutenção</div>
      <div class="contador-numero">${cont.em_manutencao}</div>
    </div>
  `;
}

function obterCadastroFrota(frota) {
  const chave = normalizarBusca(frota);
  return frotasCadastradas.find(item =>
    normalizarBusca(item.frota) === chave ||
    normalizarBusca(item.placa) === chave
  );
}

function normalizarBusca(valor) {
  return String(valor || "")
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Z0-9]/g, "");
}

function normalizarPlaca(valor) {
  return String(valor || "")
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Z0-9]+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}

function normalizarTexto(valor) {
  return String(valor || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ");
}

function hashTexto(valor) {
  let hash = 0;
  const texto = String(valor || "");

  for (let i = 0; i < texto.length; i++) {
    hash = ((hash << 5) - hash) + texto.charCodeAt(i);
    hash |= 0;
  }

  return Math.abs(hash).toString(36);
}

function idSeguro(valor) {
  return normalizarBusca(valor) || hashTexto(valor);
}

function extrairCnpsAsn(rows) {
  const headerIndex = rows.findIndex(row => {
    const headers = row.map(normalizarCabecalho);
    return headers.includes("cnp_id") &&
      headers.includes("frota") &&
      headers.includes("descricao_servico");
  });

  if (headerIndex >= 0) {
    return extrairCnpsTabela(rows, headerIndex);
  }

  const cnps = [];
  let frotaAtual = "";

  rows.forEach(row => {
    const primeiraColuna = normalizarTexto(row[0]);

    if (primeiraColuna === "frota") {
      frotaAtual = String(row[1] || "").trim();
      return;
    }

    if (primeiraColuna === "os" && frotaAtual) {
      const servicos = row
        .slice(1)
        .map(valor => String(valor || "").trim())
        .filter(Boolean);

      if (servicos.length) {
        cnps.push({
          frota: frotaAtual,
          statusImportacao: "pendente",
          servicos: servicos.map(descricao => ({ descricao }))
        });
      }
    }
  });

  return cnps;
}

function normalizarCabecalho(valor) {
  return String(valor || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_|_$/g, "");
}

function extrairCnpsTabela(rows, headerIndex) {
  const header = rows[headerIndex].map(normalizarCabecalho);
  const col = nome => header.indexOf(nome);
  const idx = {
    cnpId: col("cnp_id"),
    frota: col("frota"),
    tipo: col("tipo"),
    dataCnp: col("data_cnp"),
    prioridade: col("prioridade"),
    descricao: col("descricao_servico"),
    eixo: col("eixo"),
    lado: col("lado"),
    compartimento: col("compartimento"),
    solicitante: col("solicitante"),
    observacao: col("observacao"),
    status: col("status_importacao")
  };

  const grupos = new Map();

  rows.slice(headerIndex + 1).forEach(row => {
    const status = String(row[idx.status] || "pendente").trim().toLowerCase();
    if (["importado", "cancelado"].includes(status)) return;

    const frota = String(row[idx.frota] || "").trim();
    const descricao = String(row[idx.descricao] || "").trim();
    if (!frota || !descricao) return;

    const cnpId = String(row[idx.cnpId] || "").trim() || `CNP-${normalizarBusca(frota)}`;
    const chave = `${cnpId}|${normalizarBusca(frota)}`;

    if (!grupos.has(chave)) {
      grupos.set(chave, {
        cnpId,
        frota,
        tipo: String(row[idx.tipo] || "").trim(),
        dataCnp: row[idx.dataCnp] || "",
        prioridade: String(row[idx.prioridade] || "").trim(),
        solicitante: String(row[idx.solicitante] || "").trim(),
        observacao: String(row[idx.observacao] || "").trim(),
        statusImportacao: status || "pendente",
        servicos: []
      });
    }

    grupos.get(chave).servicos.push({
      descricao,
      eixo: String(row[idx.eixo] || "N/A").trim() || "N/A",
      lado: String(row[idx.lado] || "N/A").trim() || "N/A",
      compartimento: row[idx.compartimento] || null
    });
  });

  return Array.from(grupos.values());
}

async function lerArquivoAsn(file) {
  const buffer = await file.arrayBuffer();
  const workbook = XLSX.read(buffer, { type: "array" });
  const sheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];

  return XLSX.utils.sheet_to_json(sheet, {
    header: 1,
    defval: ""
  });
}

async function importarAsn() {
  const input = document.getElementById("arquivoAsn");
  const statusEl = document.getElementById("statusImportacaoAsn");
  const btn = document.getElementById("btnImportarAsn");
  const file = input.files?.[0];

  if (!file) {
    alert("Selecione a planilha ASN primeiro.");
    return;
  }

  if (!window.XLSX) {
    alert("Biblioteca de leitura Excel não carregou. Verifique a internet e tente novamente.");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Importando...";
  statusEl.textContent = "Lendo planilha ASN...";

  try {
    const rows = await lerArquivoAsn(file);
    const cnps = extrairCnpsAsn(rows);

    if (!cnps.length) {
      statusEl.textContent = "Nenhuma CNP encontrada. Use linhas FROTA e OS na planilha.";
      return;
    }

    const batch = writeBatch(db);
    let totalItens = 0;

    cnps.forEach(cnp => {
      const placa = normalizarPlaca(cnp.frota);
      const placaBusca = normalizarBusca(placa);
      const cadastroFrota = obterCadastroFrota(cnp.frota);
      const tipo = cnp.tipo || cadastroFrota?.tipo || "carreta";
      const assinatura = hashTexto(`${placaBusca}|${cnp.servicos.map(item => normalizarTexto(item.descricao)).join("|")}`);
      const baseId = cnp.cnpId ? `${idSeguro(cnp.cnpId)}_${placaBusca}` : `${placaBusca}_${assinatura}`;
      const implementoId = `ASN_CNP_${baseId}`;
      const implementoRef = doc(db, "implementos", implementoId);
      const inspecaoRef = doc(db, "inspecoes", implementoId);

      batch.set(implementoRef, {
        placa,
        placaNormalizada: placa,
        placaBusca,
        tipo,
        status: "aguardando_manutencao",
        tipoManutencao: "cnp",
        cnpId: cnp.cnpId || null,
        prioridade: cnp.prioridade || "normal",
        solicitante: cnp.solicitante || "",
        observacoesInspecao: cnp.observacao || "",
        origem: "planilha_asn",
        origemPlanilha: file.name,
        dataInspecao: serverTimestamp(),
        dataEnvioManutencao: serverTimestamp(),
        atualizadoEm: serverTimestamp()
      }, { merge: true });

      batch.set(inspecaoRef, {
        implementoId,
        origem: "planilha_asn",
        origemPlanilha: file.name,
        tipoManutencao: "cnp",
        cnpId: cnp.cnpId || null,
        prioridade: cnp.prioridade || "normal",
        solicitante: cnp.solicitante || "",
        observacoesInspecao: cnp.observacao || "",
        criadoEm: serverTimestamp(),
        atualizadoEm: serverTimestamp()
      }, { merge: true });

      cnp.servicos.forEach((servico, index) => {
        totalItens++;
        const descricao = servico.descricao;
        const itemId = `${implementoId}_ASN_${String(index + 1).padStart(3, "0")}`;
        const itemRef = doc(db, "naoConformidades", itemId);

        batch.set(itemRef, {
          inspecaoId: implementoId,
          grupo: "CNP",
          descricao,
          eixo: servico.eixo || "N/A",
          lado: servico.lado || "N/A",
          compartimento: servico.compartimento || null,
          tipo: "avaria",
          fotos: [],
          origem: "planilha_asn",
          resolvido: false,
          status_manutencao: null,
          criadoEm: serverTimestamp(),
          atualizadoEm: serverTimestamp()
        }, { merge: true });
      });
    });

    await batch.commit();

    statusEl.textContent = `${cnps.length} CNP(s) importada(s), com ${totalItens} item(ns).`;
    input.value = "";
  } catch (e) {
    console.error(e);
    statusEl.textContent = "Erro ao importar ASN.";
    alert("Erro ao importar ASN. Confira o formato da planilha.");
  } finally {
    btn.disabled = false;
    btn.innerText = "Importar ASN";
  }
}

// 5. EVENTOS E ATIVAÇÃO DO TEMPO REAL
document.getElementById("busca").addEventListener("input", aplicarFiltros);
document.getElementById("filtroTipo").addEventListener("change", aplicarFiltros);
document.getElementById("btnImportarAsn").addEventListener("click", importarAsn);

onSnapshot(q, (snapshot) => {
  dados = [];
  snapshot.forEach(doc => {
    dados.push({ id: doc.id, ...doc.data() });
  });
  aplicarFiltros(); 
});
</script>
</body>
</html>
