<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sugestoes de Itens</title>
  <link rel="stylesheet" href="navbar.css">

  <style>
    :root {
      --primary: #0072ce;
      --success: #16803c;
      --danger: #d92d20;
      --dark: #1f2937;
      --muted: #64748b;
      --line: rgba(6, 47, 43, 0.14);
      --bg: #f1f3f6;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--dark);
      font-family: "Montserrat", Arial, sans-serif;
      padding-bottom: 96px;
    }

    .topbar {
      position: sticky;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    }

    .topbar .logo-topbar {
      position: absolute;
      left: 50%;
      right: auto;
      grid-column: unset;
      justify-self: auto;
      transform: translateX(-50%);
    }

    .topbar .titulo-topbar,
    .topbar .topbar-acoes {
      position: relative;
      z-index: 1;
    }

    .topbar-acoes {
      display: flex;
      justify-content: flex-end;
    }

    .btn-topbar {
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .page {
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(6, 47, 43, 0.08);
      overflow: hidden;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto auto;
      gap: 10px;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
    }

    .stats {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    input,
    button {
      min-height: 42px;
      font-family: inherit;
      font-size: inherit;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(6, 47, 43, 0.16);
      border-radius: 12px;
      background: white;
      color: var(--dark);
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 114, 206, 0.16);
    }

    input[type="checkbox"] {
      width: 18px;
      min-height: 18px;
      cursor: pointer;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--dark);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .btn-primary { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-muted { background: #64748b; }

    .bulkbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: white;
    }

    .bulk-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .table-wrap {
      max-height: calc(100vh - 255px);
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid rgba(6, 47, 43, 0.1);
      vertical-align: middle;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f8fafc;
      color: #52636f;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .col-check { width: 44px; }
    .col-id { width: 250px; }
    .col-date { width: 170px; }
    .col-actions { width: 200px; }

    .doc-id {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .row-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .empty {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
      font-weight: 700;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 105px;
      transform: translateX(-50%);
      display: none;
      min-width: 240px;
      max-width: calc(100vw - 28px);
      padding: 12px 16px;
      border-radius: 999px;
      color: white;
      background: #1f2937;
      text-align: center;
      font-weight: 800;
      box-shadow: 0 14px 32px rgba(0,0,0,0.24);
      z-index: 3000;
    }

    body.dark-mode .panel,
    body.dark-mode .toolbar,
    body.dark-mode .bulkbar,
    body.dark-mode th {
      background: rgba(16, 23, 33, 0.96);
      color: #f7fbff;
      border-color: rgba(255,255,255,0.1);
    }

    body.dark-mode .hint,
    body.dark-mode .stats,
    body.dark-mode .doc-id,
    body.dark-mode th {
      color: #cbd5e1;
    }

    body.dark-mode td {
      border-color: rgba(255,255,255,0.08);
    }

    @media (max-width: 900px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .table-wrap {
        max-height: none;
      }

      table,
      thead,
      tbody,
      tr,
      th,
      td {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }

      td {
        padding: 7px 0;
        border: none;
      }

      .col-id,
      .col-date,
      .col-actions {
        width: auto;
      }

      .row-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <span class="titulo-topbar">Sugestoes de Itens</span>
    <img src="suzano-logo.png" class="logo-topbar" alt="Suzano">
    <div class="topbar-acoes">
      <button class="btn-topbar" onclick="window.location='admin.html'">Admin</button>
    </div>
  </div>

  <main class="page">
    <section class="panel">
      <div class="toolbar">
        <input id="busca" placeholder="Buscar por descricao ou ID">
        <div id="contador" class="stats">Carregando...</div>
        <button id="btnRecarregar" class="btn-primary">Recarregar</button>
        <button id="btnSelecionarVisiveis" class="btn-muted">Selecionar visiveis</button>
      </div>

      <div class="bulkbar">
        <div id="selecionadosInfo" class="hint">Nenhum item selecionado.</div>
        <div class="bulk-actions">
          <button id="btnLimparSelecao" class="btn-muted">Limpar selecao</button>
          <button id="btnExcluirSelecionados" class="btn-danger">Excluir selecionados</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-check"></th>
              <th>Descricao</th>
              <th class="col-id">ID do documento</th>
              <th class="col-date">Atualizado</th>
              <th class="col-actions">Acoes</th>
            </tr>
          </thead>
          <tbody id="lista">
            <tr>
              <td colspan="5">
                <div class="empty">Carregando sugestoes...</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <script type="module">
    import { protegerPagina } from "./auth.js";
    protegerPagina(["tecnico"]);

    import { db } from "./firebase.js";
    import {
      collection,
      deleteDoc,
      doc,
      getDocs,
      serverTimestamp,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { carregarNavbar } from "./navbar.js";

    carregarNavbar();

    const buscaEl = document.getElementById("busca");
    const contadorEl = document.getElementById("contador");
    const listaEl = document.getElementById("lista");
    const selecionadosInfoEl = document.getElementById("selecionadosInfo");
    const btnRecarregar = document.getElementById("btnRecarregar");
    const btnSelecionarVisiveis = document.getElementById("btnSelecionarVisiveis");
    const btnLimparSelecao = document.getElementById("btnLimparSelecao");
    const btnExcluirSelecionados = document.getElementById("btnExcluirSelecionados");

    let sugestoes = [];
    let filtradas = [];
    let selecionadas = new Set();

    btnRecarregar.addEventListener("click", carregarSugestoes);
    buscaEl.addEventListener("input", renderLista);
    btnSelecionarVisiveis.addEventListener("click", selecionarVisiveis);
    btnLimparSelecao.addEventListener("click", limparSelecao);
    btnExcluirSelecionados.addEventListener("click", excluirSelecionadas);

    async function carregarSugestoes() {
      setCarregando(true);
      listaEl.innerHTML = emptyRow("Carregando sugestoes...");

      try {
        const snap = await getDocs(collection(db, "sugestoesDescricoesItens"));

        sugestoes = snap.docs
          .map(item => ({
            id: item.id,
            ...item.data()
          }))
          .sort((a, b) => normalizarTexto(a.descricao).localeCompare(normalizarTexto(b.descricao)));

        selecionadas = new Set([...selecionadas].filter(id => sugestoes.some(item => item.id === id)));
        renderLista();
        showToast("Sugestoes carregadas.");
      } catch (erro) {
        console.error(erro);
        listaEl.innerHTML = emptyRow("Erro ao carregar sugestoes.");
        contadorEl.innerText = "Erro";
      } finally {
        setCarregando(false);
      }
    }

    function renderLista() {
      const termo = normalizarTexto(buscaEl.value);

      filtradas = sugestoes.filter(item => {
        const descricao = normalizarTexto(item.descricao);
        const descricaoNormalizada = normalizarTexto(item.descricaoNormalizada);
        const id = normalizarTexto(item.id);
        return !termo || descricao.includes(termo) || descricaoNormalizada.includes(termo) || id.includes(termo);
      });

      contadorEl.innerText = `${filtradas.length} de ${sugestoes.length} sugestoes`;

      if (!filtradas.length) {
        listaEl.innerHTML = emptyRow("Nenhuma sugestao encontrada.");
        atualizarSelecao();
        return;
      }

      listaEl.innerHTML = filtradas.map(item => {
        const checked = selecionadas.has(item.id) ? "checked" : "";
        return `
          <tr>
            <td class="col-check">
              <input type="checkbox" ${checked} data-action="toggle" data-id="${attr(item.id)}" aria-label="Selecionar item">
            </td>
            <td>
              <input value="${attr(item.descricao || "")}" data-field="descricao" data-id="${attr(item.id)}">
            </td>
            <td class="col-id">
              <div class="doc-id">${escapeHTML(item.id)}</div>
            </td>
            <td class="col-date">${escapeHTML(formatarData(item.atualizadoEm || item.criadoEm))}</td>
            <td class="col-actions">
              <div class="row-actions">
                <button class="btn-success" data-action="save" data-id="${attr(item.id)}">Salvar</button>
                <button class="btn-danger" data-action="delete" data-id="${attr(item.id)}">Excluir</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      atualizarSelecao();
    }

    listaEl.addEventListener("click", async event => {
      const alvo = event.target;
      const action = alvo.dataset.action;
      const id = alvo.dataset.id;

      if (!action || !id) return;

      if (action === "toggle") {
        if (alvo.checked) {
          selecionadas.add(id);
        } else {
          selecionadas.delete(id);
        }
        atualizarSelecao();
        return;
      }

      if (action === "save") {
        await salvarItem(id, alvo);
        return;
      }

      if (action === "delete") {
        await excluirItem(id, alvo);
      }
    });

    async function salvarItem(id, btn) {
      const input = document.querySelector(`[data-field="descricao"][data-id="${cssEscape(id)}"]`);
      const descricao = input?.value.trim() || "";

      if (!descricao) {
        alert("Informe uma descricao antes de salvar.");
        return;
      }

      const normalizada = normalizarTextoBusca(descricao);
      const duplicada = sugestoes.find(item =>
        item.id !== id &&
        normalizarTextoBusca(item.descricao || item.descricaoNormalizada) === normalizada
      );

      if (duplicada && !confirm(`Ja existe uma sugestao muito parecida:\n\n${duplicada.descricao}\n\nDeseja salvar mesmo assim?`)) {
        return;
      }

      btn.disabled = true;

      try {
        await updateDoc(doc(db, "sugestoesDescricoesItens", id), {
          descricao,
          descricaoNormalizada: normalizada,
          atualizadoEm: serverTimestamp()
        });

        const item = sugestoes.find(s => s.id === id);
        if (item) {
          item.descricao = descricao;
          item.descricaoNormalizada = normalizada;
          item.atualizadoEm = new Date();
        }

        renderLista();
        showToast("Sugestao salva.");
      } catch (erro) {
        console.error(erro);
        alert("Erro ao salvar sugestao.");
      } finally {
        btn.disabled = false;
      }
    }

    async function excluirItem(id, btn) {
      const item = sugestoes.find(s => s.id === id);
      const texto = item?.descricao || id;

      if (!confirm(`Excluir esta sugestao?\n\n${texto}`)) return;

      btn.disabled = true;

      try {
        await deleteDoc(doc(db, "sugestoesDescricoesItens", id));
        sugestoes = sugestoes.filter(s => s.id !== id);
        selecionadas.delete(id);
        renderLista();
        showToast("Sugestao excluida.");
      } catch (erro) {
        console.error(erro);
        alert("Erro ao excluir sugestao.");
      } finally {
        btn.disabled = false;
      }
    }

    function selecionarVisiveis() {
      filtradas.forEach(item => selecionadas.add(item.id));
      renderLista();
    }

    function limparSelecao() {
      selecionadas.clear();
      renderLista();
    }

    async function excluirSelecionadas() {
      const ids = [...selecionadas];

      if (!ids.length) {
        alert("Selecione pelo menos uma sugestao para excluir.");
        return;
      }

      if (!confirm(`Excluir ${ids.length} sugestao(oes) selecionada(s)?`)) return;

      btnExcluirSelecionados.disabled = true;

      try {
        for (const id of ids) {
          await deleteDoc(doc(db, "sugestoesDescricoesItens", id));
        }

        sugestoes = sugestoes.filter(item => !selecionadas.has(item.id));
        selecionadas.clear();
        renderLista();
        showToast("Sugestoes selecionadas excluidas.");
      } catch (erro) {
        console.error(erro);
        alert("Erro ao excluir sugestoes selecionadas.");
      } finally {
        btnExcluirSelecionados.disabled = false;
      }
    }

    function atualizarSelecao() {
      const total = selecionadas.size;
      selecionadosInfoEl.innerText = total
        ? `${total} item(ns) selecionado(s).`
        : "Nenhum item selecionado.";

      btnExcluirSelecionados.disabled = total === 0;
      btnLimparSelecao.disabled = total === 0;
    }

    function setCarregando(carregando) {
      btnRecarregar.disabled = carregando;
      btnSelecionarVisiveis.disabled = carregando;
      btnExcluirSelecionados.disabled = carregando || selecionadas.size === 0;
    }

    function normalizarTexto(valor) {
      return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function normalizarTextoBusca(valor) {
      return normalizarTexto(valor).replace(/\s+/g, " ");
    }

    function formatarData(valor) {
      if (!valor) return "-";

      try {
        const data = valor.toDate ? valor.toDate() : new Date(valor);
        if (Number.isNaN(data.getTime())) return "-";
        return data.toLocaleString("pt-BR");
      } catch (erro) {
        return "-";
      }
    }

    function emptyRow(texto) {
      return `
        <tr>
          <td colspan="5">
            <div class="empty">${escapeHTML(texto)}</div>
          </td>
        </tr>
      `;
    }

    function attr(valor) {
      return escapeHTML(String(valor ?? "")).replace(/"/g, "&quot;");
    }

    function escapeHTML(valor) {
      return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function cssEscape(valor) {
      if (window.CSS && CSS.escape) return CSS.escape(valor);
      return String(valor).replace(/"/g, '\\"');
    }

    function showToast(mensagem) {
      const toast = document.getElementById("toast");
      toast.innerText = mensagem;
      toast.style.display = "block";

      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toast.style.display = "none";
      }, 1800);
    }

    carregarSugestoes();
  </script>
</body>
</html>
